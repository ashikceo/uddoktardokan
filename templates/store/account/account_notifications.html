{% extends 'store/account/account_center_base.html' %}
{% block account_tab_content %}
<div class="ud-card">
  <h1 class="ud-page-title">Notification preferences</h1>
  <p class="ud-page-sub">Choose what updates you receive by email / in-app.</p>

  <form method="POST" action="{% url 'account_notifications' %}" class="ud-form ud-form-narrow">
    {% csrf_token %}
    <label class="ud-check-row">
      <div><strong>Order updates</strong><p class="ud-hint">Order placed, status change and tracking updates.</p></div>
      <input type="checkbox" name="order_updates" {% if prefs.order_updates %}checked{% endif %}>
    </label>
    <label class="ud-check-row">
      <div><strong>Review &amp; Q&amp;A replies</strong><p class="ud-hint">When someone replies to your reviews or questions.</p></div>
      <input type="checkbox" name="review_replies" {% if prefs.review_replies %}checked{% endif %}>
    </label>
    <label class="ud-check-row">
      <div><strong>Promotions &amp; offers</strong><p class="ud-hint">Deals, discounts and marketing updates.</p></div>
      <input type="checkbox" name="promotions" {% if prefs.promotions %}checked{% endif %}>
    </label>
    <label class="ud-check-row">
      <div><strong>Security alerts</strong><p class="ud-hint">Login alerts, password and 2FA changes.</p></div>
      <input type="checkbox" name="security_alerts" {% if prefs.security_alerts %}checked{% endif %}>
    </label>
    <button class="ud-btn ud-btn-primary" type="submit">Save preferences</button>
  </form>

  <div class="ud-sep"></div>
  <h3 class="ud-card-title">Notification inbox</h3>
  <p class="ud-hint">View your recent notifications and mark them as read.</p>
  <a href="{% url 'dashboard_notifications' %}" class="ud-btn ud-btn-outline">Open notifications</a>
</div>
{% endblock %}
